# DeloWay terminal configuration (strictly monochrome).
# Launched by bin/delo-app with KITTY_CONFIG_DIRECTORY pointing here, so kitty also
# picks up dark-theme.auto.conf / light-theme.auto.conf next to this file and
# follows the system Dark/Light mode (set by Settings → Appearance) live.
# The terminal is the one place the UI typeface (Cairo) never applies: it keeps a
# monospace font. Arabic, which JetBrains Mono lacks, comes from DejaVu Sans Mono (also
# monospace, ttf-dejavu) instead of fontconfig's sans-serif fallback, which is Cairo.
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5
symbol_map U+0600-U+06FF,U+0750-U+077F,U+08A0-U+08FF,U+FB50-U+FDFF,U+FE70-U+FEFF DejaVu Sans Mono

# Fallback palette (dark) — overridden by the *.auto.conf files on kitty ≥ 0.38.
include dark-theme.auto.conf

# Padding & Window
window_padding_width 12
confirm_os_window_close 0
enable_audio_bell no
