# GENERATED by scripts/deloway-shortcuts.py gen from config/shortcuts.json — do not
# edit by hand. Changes made in Settings → Shortcuts are applied at runtime on top.


# ── Shell ─────────────────────────────────────────────────────────────────
# App drawer & search
bind = SUPER, Space, global, quickshell:drawerToggle
# Quick Settings
bind = SUPER, M, global, quickshell:quickSettingsToggle
# Smart Notch
bind = SUPER ALT, N, global, quickshell:smartNotchToggle
# Left sidebar
bind = SUPER, A, global, quickshell:sidebarLeftToggle
bind = SUPER SHIFT, A, global, quickshell:sidebarLeftToggle
# Right sidebar
bind = SUPER, N, global, quickshell:sidebarRightToggle
# Clipboard history
bind = SUPER, V, global, quickshell:clipboardToggle
# DeloWay Settings
bind = SUPER, I, global, quickshell:settingsToggle
# Shortcuts guide
bind = SUPER, slash, global, quickshell:cheatsheetToggle
bind = SUPER, T, global, quickshell:cheatsheetToggle
bind = SUPER SHIFT, slash, global, quickshell:cheatsheetToggle
bind = SUPER SHIFT, question, global, quickshell:cheatsheetToggle
# Hide / show bar & Dock
bind = SUPER SHIFT, F, global, quickshell:shellToggle
# On-screen keyboard
bind = SUPER, K, exec, killall wvkbd-mobintl || wvkbd-mobintl -L 300
# Change wallpaper
bind = CTRL SUPER, T, exec, $delowayDir/scripts/change-wallpaper.sh || waypaper
# Restart the shell
bind = CTRL SUPER, R, exec, killall quickshell; sleep 1.5; quickshell -p $delowayDir/shell

# ── Apps ──────────────────────────────────────────────────────────────────
# Terminal
bind = SUPER, Return, exec, $delowayDir/bin/delo-app terminal
# File manager
bind = SUPER, E, exec, $delowayDir/bin/delo-app files
# Browser
bind = SUPER, W, exec, $delowayDir/bin/delo-app browser
# Code editor
bind = SUPER, C, exec, antigravity-ide || code
# Office suite
bind = SUPER SHIFT, W, exec, libreoffice
# Text editor
bind = SUPER, X, exec, $delowayDir/bin/delo-app editor
# System monitor
bind = CTRL SHIFT, Escape, exec, $delowayDir/bin/delo-app monitor
# Volume mixer
bind = CTRL SUPER, V, exec, $delowayDir/bin/delo-app mixer
# Edit the Hyprland config
bind = CTRL SUPER, slash, exec, $delowayDir/bin/delo-app editor $delowayDir/config/hyprland.conf
bind = CTRL SUPER ALT, slash, exec, $delowayDir/bin/delo-app editor $delowayDir/config/hyprland.conf

# ── Windows ───────────────────────────────────────────────────────────────
# Close window
bind = SUPER, Q, killactive
# Force-kill a window
bind = SUPER SHIFT ALT, Q, exec, hyprctl kill
# Float / tile
bind = SUPER ALT, space, togglefloating
# Maximize
bind = SUPER, D, fullscreen, 1
# Fullscreen
bind = SUPER, F, fullscreen, 0
# Fake fullscreen
bind = SUPER ALT, F, fullscreenstate, -1 2
# Pin on top
bind = SUPER, P, pin
# Toggle split direction
bind = SUPER, Backslash, layoutmsg, togglesplit
# Shrink split ratio
binde = SUPER, semicolon, layoutmsg, splitratio -0.1
# Grow split ratio
binde = SUPER, apostrophe, layoutmsg, splitratio +0.1
# Group / ungroup
bind = SUPER, G, togglegroup
# Next window in group
bind = SUPER, Tab, changegroupactive, f
# Focus in a direction
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d
# Move in a direction
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d
# Resize
binde = SUPER ALT, left, resizeactive, -25 0
binde = SUPER ALT, right, resizeactive, 25 0
binde = SUPER ALT, up, resizeactive, 0 -25
binde = SUPER ALT, down, resizeactive, 0 25
# Move with the mouse
bindm = SUPER, mouse:272, movewindow
# Resize with the mouse
bindm = SUPER, mouse:273, resizewindow

# ── Workspaces ────────────────────────────────────────────────────────────
# Go to workspace
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10
# Send window to workspace
bind = SUPER ALT, 1, movetoworkspacesilent, 1
bind = SUPER ALT, 2, movetoworkspacesilent, 2
bind = SUPER ALT, 3, movetoworkspacesilent, 3
bind = SUPER ALT, 4, movetoworkspacesilent, 4
bind = SUPER ALT, 5, movetoworkspacesilent, 5
bind = SUPER ALT, 6, movetoworkspacesilent, 6
bind = SUPER ALT, 7, movetoworkspacesilent, 7
bind = SUPER ALT, 8, movetoworkspacesilent, 8
bind = SUPER ALT, 9, movetoworkspacesilent, 9
bind = SUPER ALT, 0, movetoworkspacesilent, 10
# Previous workspace
bind = CTRL SUPER, left, workspace, e-1
bind = SUPER, Prior, workspace, e-1
bind = SUPER, Page_Up, workspace, e-1
# Next workspace
bind = CTRL SUPER, right, workspace, e+1
bind = SUPER, Next, workspace, e+1
bind = SUPER, Page_Down, workspace, e+1
# Switch workspaces with the wheel
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1
# Send to previous workspace
bind = SUPER SHIFT, Prior, movetoworkspace, e-1
bind = SUPER SHIFT, Page_Up, movetoworkspace, e-1
bind = SUPER SHIFT CTRL, left, movetoworkspace, e-1
# Send to next workspace
bind = SUPER SHIFT, Next, movetoworkspace, e+1
bind = SUPER SHIFT, Page_Down, movetoworkspace, e+1
bind = SUPER SHIFT CTRL, right, movetoworkspace, e+1
# Show the hidden workspace
bind = SUPER, S, togglespecialworkspace, special
# Send to the hidden workspace
bind = SUPER ALT, S, movetoworkspace, special:special

# ── Tools ─────────────────────────────────────────────────────────────────
# Screenshot a region
bind = SUPER SHIFT, S, exec, $delowayDir/scripts/screenshot.sh area
# Screenshot the screen
bind = , Print, exec, $delowayDir/scripts/screenshot.sh full
bind = CTRL, Print, exec, $delowayDir/scripts/screenshot.sh full
# Pick a colour to the clipboard
bind = SUPER SHIFT, C, exec, hyprpicker -a
# Record a region (no sound)
bind = SUPER ALT, R, exec, wf-recorder -g "$(slurp)" -f ~/Videos/recording_$(date +%s).mp4
# Record a region (with sound)
bind = SUPER SHIFT ALT, R, exec, wf-recorder --audio -g "$(slurp)" -f ~/Videos/recording_$(date +%s).mp4
# Reset cursor zoom
bind = SUPER, minus, exec, hyprctl keyword cursor:zoom_factor 1.0
# Zoom around the cursor
bind = SUPER, equal, exec, hyprctl keyword cursor:zoom_factor 1.5

# ── Session ───────────────────────────────────────────────────────────────
# Session menu
bind = CTRL ALT, Delete, global, quickshell:sessionMenuToggle
# Lock the screen
bind = SUPER, L, exec, qs ipc -p $delowayDir/shell call deloway lock || hyprlock
# Suspend
bind = SUPER SHIFT, L, exec, systemctl suspend || loginctl suspend

# ── Media & hardware ──────────────────────────────────────────────────────
# Play / pause
bind = SUPER SHIFT, P, exec, playerctl play-pause
# Next track
bind = SUPER SHIFT, N, exec, playerctl next
# Previous track
bind = SUPER SHIFT, B, exec, playerctl previous
# Play / pause (media key)
bind = , XF86AudioPlay, exec, playerctl play-pause
# Next (media key)
bind = , XF86AudioNext, exec, playerctl next
# Previous (media key)
bind = , XF86AudioPrev, exec, playerctl previous
# Stop (media key)
bind = , XF86AudioStop, exec, playerctl stop
# Volume up
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
# Volume down
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# Mute
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# Mute the microphone
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# Brightness up
binde = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
# Brightness down
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Settings → Shortcuts records a new shortcut in this empty submap, so the keys
# reach the shell instead of running their current action. The shell leaves it
# itself; Super+Ctrl+Alt+Escape gets out if it ever cannot.
submap = deloway-record
bind = SUPER CTRL ALT, Escape, submap, reset
submap = reset
