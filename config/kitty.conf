# Deloway Terminal Configuration (Strictly Monospace)
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Fluent Dark Palette
background       #1e1e1e
foreground       #ffffff
selection_background #0078d4
selection_foreground #ffffff
cursor           #60cdff
cursor_text_color #1e1e1e

# Padding & Window
window_padding_width 12
confirm_os_window_close 0
enable_audio_bell no
