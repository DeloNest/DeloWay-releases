# Deloway Desktop - Isolated Hyprland Configuration
# Crafted for end-4/dots-hyprland physics, animations, and Fluent aesthetics

# Environment variables for Deloway & Reversal Icon Theme
# Repo location. install.sh rewrites this line in ~/.config/deloway/hyprland.conf when the
# repo is cloned elsewhere; DELOWAY_DIR tells the shell and helpers the same path.
$delowayDir = $HOME/Projects/Deloway
env = DELOWAY_DIR,$delowayDir
env = QS_ICON_THEME,Reversal-black-dark
env = XDG_DATA_DIRS,$HOME/.local/share:/usr/local/share:/usr/share
# Qt apps take palette + fonts from the DeloWay GTK theme (see deloway-theme-apply.py)
env = QT_QPA_PLATFORMTHEME,gtk3
# KDE apps started on their own (Ark, Okular…) do not apply kdeglobals' widgetStyle as
# Dolphin does, and fell back to the flat Fusion style. Qt ignores this if Breeze is missing.
env = QT_STYLE_OVERRIDE,Breeze

# Monitors
monitor = , preferred, auto, 1

# Input configuration
input {
    kb_layout = us,ara
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    touchpad {
        natural_scroll = false
    }
    sensitivity = 0
}

# General aesthetics - Fluent Design & Dwindle
general {
    gaps_in = 3
    gaps_out = 6
    border_size = 2
    col.active_border = rgba(ffffffdd)
    col.inactive_border = rgba(444444cc)
    resize_on_border = true
    extend_border_grab_area = 15
    hover_icon_on_border = true
    layout = dwindle
}

decoration {
    rounding = 8
    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 14
        render_power = 2
        color = rgba(00000055)
    }
}

# end-4 physics and bezier curves
animations {
    enabled = true

    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    bezier = md3_accel, 0.3, 0, 0.8, 0.15
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = menu_decel, 0.1, 1, 0, 1
    bezier = menu_accel, 0.38, 0.04, 1, 0.07
    bezier = easeOutCirc, 0, 0.55, 0.45, 1
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    bezier = softAcDecel, 0.26, 0.26, 0.15, 1
    bezier = md2, 0.4, 0, 0.2, 1

    animation = windows, 1, 3, md3_decel, popin 60%
    animation = windowsIn, 1, 3, md3_decel, popin 60%
    animation = windowsOut, 1, 3, md3_accel, popin 60%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 3, md3_decel
    animation = layersIn, 1, 3, menu_decel, slide
    animation = layersOut, 1, 1.6, menu_accel
    animation = fadeLayersIn, 1, 2, menu_decel
    animation = fadeLayersOut, 1, 4.5, menu_accel
    animation = workspaces, 1, 3.5, md3_decel, slide
    animation = specialWorkspace, 1, 3, md3_decel, slidevert
}

dwindle {
    preserve_split = true
    smart_split = false
    smart_resizing = true
}

misc {
    font_family = Cairo          # the shell syncs it to Settings → Appearance → font
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
    # A restarted shell can take over an existing session lock after a crash
    # (otherwise Hyprland stays on its 'lock screen crashed' fallback).
    allow_session_lock_restore = true
}

xwayland {
    enabled = false
}

debug {
    disable_logs = false
    enable_stdout_logs = true
}

# ==============================================================================
# Keybindings - DeloWay Standard Set
# ==============================================================================
$mainMod = SUPER

# ── Super alone ───────────────────────────────────────────────────────────────
# Super alone (tap) -> Start-style App Drawer. Tap-vs-combo detection lives in a
# generated file (one transparent, non-consuming interrupt bind per keycode).
source = $delowayDir/config/hypr-startmenu.conf

# ── Every other shortcut ──────────────────────────────────────────────────────
# Generated from config/shortcuts.json (scripts/deloway-shortcuts.py gen): the same
# catalog Settings → Shortcuts and the cheat sheet read. Changes made in Settings are
# applied on top at runtime; edit the catalog to change a default.
source = $delowayDir/config/hypr-binds.conf

# Keep workspaces 1-5 alive even when empty (persistent)
workspace = 1, persistent:true
workspace = 2, persistent:true
workspace = 3, persistent:true
workspace = 4, persistent:true
workspace = 5, persistent:true

# ==============================================================================
# Window Rules - Modern Hyprland Standard
# ==============================================================================

# Dialogs & File Pickers
windowrule = float on, match:title ^(Open Folder|Open File|Save As|File Upload|Choose Files|Select a File|Enter name of file to save to.*|Save File)$
windowrule = center on, match:title ^(Open Folder|Open File|Save As|File Upload|Choose Files|Select a File|Enter name of file to save to.*|Save File)$
windowrule = size 800 550, match:title ^(Open Folder|Open File|Save As|File Upload|Choose Files|Select a File|Enter name of file to save to.*|Save File)$

# Authentication & Polkit Dialogs
windowrule = float on, match:class ^(polkit-gnome-authentication-agent-1|lxqt-policykit-agent|org.kde.polkit-kde-authentication-agent-1|hyprpolkitagent)$
windowrule = center on, match:class ^(polkit-gnome-authentication-agent-1|lxqt-policykit-agent|org.kde.polkit-kde-authentication-agent-1|hyprpolkitagent)$
windowrule = dim_around on, match:class ^(polkit-gnome-authentication-agent-1|lxqt-policykit-agent|org.kde.polkit-kde-authentication-agent-1|hyprpolkitagent)$

# Audio / Volume Controls
windowrule = float on, match:class ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$
windowrule = size 700 480, match:class ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$
windowrule = center on, match:class ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$

# Bluetooth & Network Utilities
windowrule = float on, match:class ^(blueman-manager|nm-connection-editor)$
windowrule = size 600 450, match:class ^(blueman-manager|nm-connection-editor)$
windowrule = center on, match:class ^(blueman-manager|nm-connection-editor)$

# Picture-in-Picture
windowrule = float on, match:title ^(Picture-in-Picture)$
windowrule = pin on, match:title ^(Picture-in-Picture)$
windowrule = keep_aspect_ratio on, match:title ^(Picture-in-Picture)$
windowrule = size 480 270, match:title ^(Picture-in-Picture)$
windowrule = move 100%-495 100%-285, match:title ^(Picture-in-Picture)$

# Layer rules for Quickshell overlays & Deloway surfaces
# Dock and App Drawer (deloway:launcher) are intentionally NOT blurred: flat, clean edges.
layerrule = blur on, match:namespace deloway:(topbar|sessionmenu|notification-toast)
layerrule = ignore_alpha 0.2, match:namespace deloway:(topbar|sessionmenu|notification-toast)
layerrule = no_anim on, match:namespace deloway:screenshot-overlay
layerrule = dim_around on, match:namespace deloway:sessionmenu

# Launch Deloway Quickshell Shell & Services
exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent
# Icon theme (Reversal-black / Reversal-black-dark) follows the Dark/Light mode via
# scripts/deloway-theme-apply.py; it is no longer forced to the dark variant at login.
# Notch → Share speaks LocalSend itself (scripts/deloway-localsend.py, started by the shell
# when needed): the LocalSend app (~420 MB) is no longer kept running hidden at login.
exec-once = quickshell -p $delowayDir/shell
exec-once = $delowayDir/scripts/deloway-wallpaper-daemon.py
exec-once = sleep 1 && hyprctl dismissnotify
