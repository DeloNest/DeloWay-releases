# Deloway Desktop - Isolated Hyprland Configuration
# Crafted for end-4/dots-hyprland physics, animations, and Fluent aesthetics

# Environment variables for Deloway & Reversal Icon Theme
$delowayDir = ~/Projects/Deloway
env = QS_ICON_THEME,Reversal-black-dark
env = XDG_DATA_DIRS,$HOME/.local/share:/usr/local/share:/usr/share
# Qt apps take palette + fonts from the DeloWay GTK theme (see deloway-theme-apply.py)
env = QT_QPA_PLATFORMTHEME,gtk3

# Monitors
monitor = , preferred, auto, 1

# Input configuration
input {
    kb_layout = us,ara
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    touchpad {
        natural_scroll = false
    }
    sensitivity = 0
}

# General aesthetics - Fluent Design & Dwindle
general {
    gaps_in = 3
    gaps_out = 6
    border_size = 2
    col.active_border = rgba(ffffffdd)
    col.inactive_border = rgba(444444cc)
    resize_on_border = true
    extend_border_grab_area = 15
    hover_icon_on_border = true
    layout = dwindle
}

decoration {
    rounding = 8
    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 14
        render_power = 2
        color = rgba(00000055)
    }
}

# end-4 physics and bezier curves
animations {
    enabled = true

    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    bezier = md3_accel, 0.3, 0, 0.8, 0.15
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = menu_decel, 0.1, 1, 0, 1
    bezier = menu_accel, 0.38, 0.04, 1, 0.07
    bezier = easeOutCirc, 0, 0.55, 0.45, 1
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    bezier = softAcDecel, 0.26, 0.26, 0.15, 1
    bezier = md2, 0.4, 0, 0.2, 1

    animation = windows, 1, 3, md3_decel, popin 60%
    animation = windowsIn, 1, 3, md3_decel, popin 60%
    animation = windowsOut, 1, 3, md3_accel, popin 60%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 3, md3_decel
    animation = layersIn, 1, 3, menu_decel, slide
    animation = layersOut, 1, 1.6, menu_accel
    animation = fadeLayersIn, 1, 2, menu_decel
    animation = fadeLayersOut, 1, 4.5, menu_accel
    animation = workspaces, 1, 3.5, md3_decel, slide
    animation = specialWorkspace, 1, 3, md3_decel, slidevert
}

dwindle {
    preserve_split = true
    smart_split = false
    smart_resizing = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
    # A restarted shell can take over an existing session lock after a crash
    # (otherwise Hyprland stays on its 'lock screen crashed' fallback).
    allow_session_lock_restore = true
}

xwayland {
    enabled = false
}

debug {
    disable_logs = false
    enable_stdout_logs = true
}

# ==============================================================================
# Keybindings - DeloWay Standard Set
# ==============================================================================
$mainMod = SUPER

# ── 1. Shell ──────────────────────────────────────────────────────────────────
# Super alone (tap) -> Start-style App Drawer. Tap-vs-combo detection lives in a
# generated file (one transparent, non-consuming interrupt bind per keycode).
source = ~/Projects/Deloway/config/hypr-startmenu.conf
# Immersion mode (hide capsules + dock) moved from Super-alone to Super+Shift+F
bind = $mainMod SHIFT, F, global, quickshell:shellToggle
# Super + Space -> Toggle app drawer / search launcher
bind = $mainMod, Space, global, quickshell:drawerToggle
bind = $mainMod, V, exec, cliphist list | fuzzel --match-mode fzf --dmenu | cliphist decode | wl-copy || cliphist list | wofi -dmenu | cliphist decode | wl-copy
bind = $mainMod, A, global, quickshell:sidebarLeftToggle
bind = $mainMod, N, global, quickshell:sidebarRightToggle
bind = $mainMod ALT, N, global, quickshell:smartNotchToggle
bind = $mainMod, slash, global, quickshell:cheatsheetToggle
bind = $mainMod, T, global, quickshell:cheatsheetToggle
bind = $mainMod, K, exec, killall wvkbd-mobintl || wvkbd-mobintl -L 300
bind = $mainMod, M, global, quickshell:quickSettingsToggle
bind = CTRL ALT, Delete, global, quickshell:sessionMenuToggle
bind = CTRL $mainMod, T, exec, $delowayDir/scripts/change-wallpaper.sh || waypaper
bind = CTRL $mainMod, R, exec, killall quickshell; sleep 0.4; quickshell -p $delowayDir/shell

# ── 2. Utilities ──────────────────────────────────────────────────────────────
bind = $mainMod SHIFT, S, exec, $delowayDir/scripts/screenshot.sh area
bind = $mainMod SHIFT, C, exec, hyprpicker -a
bind = , Print, exec, $delowayDir/scripts/screenshot.sh full
bind = CTRL, Print, exec, $delowayDir/scripts/screenshot.sh full
bind = $mainMod ALT, R, exec, wf-recorder -g "$(slurp)" -f ~/Videos/recording_$(date +%s).mp4
bind = $mainMod SHIFT ALT, R, exec, wf-recorder --audio -g "$(slurp)" -f ~/Videos/recording_$(date +%s).mp4

# ── 3. Window ─────────────────────────────────────────────────────────────────
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT ALT, Q, exec, hyprctl kill
binde = $mainMod, semicolon, layoutmsg, splitratio -0.1
binde = $mainMod, apostrophe, layoutmsg, splitratio +0.1
bind = $mainMod ALT, space, togglefloating
bind = $mainMod, D, fullscreen, 1
bind = $mainMod, F, fullscreen, 0
bind = $mainMod ALT, F, fullscreenstate, -1 2
bind = $mainMod, P, pin
bind = $mainMod ALT, 1, movetoworkspacesilent, 1
bind = $mainMod ALT, 2, movetoworkspacesilent, 2
bind = $mainMod ALT, 3, movetoworkspacesilent, 3
bind = $mainMod ALT, 4, movetoworkspacesilent, 4
bind = $mainMod ALT, 5, movetoworkspacesilent, 5
bind = $mainMod ALT, 6, movetoworkspacesilent, 6
bind = $mainMod ALT, 7, movetoworkspacesilent, 7
bind = $mainMod ALT, 8, movetoworkspacesilent, 8
bind = $mainMod ALT, 9, movetoworkspacesilent, 9
bind = $mainMod ALT, 0, movetoworkspacesilent, 10
bind = $mainMod SHIFT, Prior, movetoworkspace, e-1
bind = $mainMod SHIFT, Next, movetoworkspace, e+1
bind = $mainMod SHIFT, Page_Up, movetoworkspace, e-1
bind = $mainMod SHIFT, Page_Down, movetoworkspace, e+1
bind = $mainMod SHIFT CTRL, left, movetoworkspace, e-1
bind = $mainMod SHIFT CTRL, right, movetoworkspace, e+1
bind = $mainMod ALT, S, movetoworkspace, special:special

# Window resize with keyboard (Super+Alt: Super+Ctrl+Left/Right switches workspaces)
binde = $mainMod ALT, left, resizeactive, -25 0
binde = $mainMod ALT, right, resizeactive, 25 0
binde = $mainMod ALT, up, resizeactive, 0 -25
binde = $mainMod ALT, down, resizeactive, 0 25

# ── 4. Workspace ──────────────────────────────────────────────────────────────
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Keep all workspaces alive even when empty (persistent)
workspace = 1, persistent:true
workspace = 2, persistent:true
workspace = 3, persistent:true
workspace = 4, persistent:true
workspace = 5, persistent:true
bind = CTRL $mainMod, left, workspace, e-1
bind = CTRL $mainMod, right, workspace, e+1
bind = $mainMod, Prior, workspace, e-1
bind = $mainMod, Next, workspace, e+1
bind = $mainMod, Page_Up, workspace, e-1
bind = $mainMod, Page_Down, workspace, e+1
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = $mainMod, S, togglespecialworkspace, special

# Layout toggles
bind = $mainMod, Backslash, layoutmsg, togglesplit
bind = $mainMod, G, togglegroup,
bind = $mainMod, Tab, changegroupactive, f

# ── 5. Session ────────────────────────────────────────────────────────────────
# Lock through the shell's own ext-session-lock screen; hyprlock only if the shell
# is not running (qs ipc exits non-zero). `loginctl lock-session` alone locks nothing:
# no logind listener is running, and it exits 0, so a fallback after it never ran.
bind = $mainMod, L, exec, qs ipc -p $delowayDir/shell call deloway lock || hyprlock
bind = $mainMod SHIFT, L, exec, systemctl suspend || loginctl suspend

# ── 6. Screen ─────────────────────────────────────────────────────────────────
bind = $mainMod, minus, exec, hyprctl keyword cursor:zoom_factor 1.0
bind = $mainMod, equal, exec, hyprctl keyword cursor:zoom_factor 1.5

# ── 7. Media & Hardware Controls ──────────────────────────────────────────────
bind = $mainMod SHIFT, N, exec, playerctl next
bind = $mainMod SHIFT, B, exec, playerctl previous
bind = $mainMod SHIFT, P, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioStop, exec, playerctl stop

# Audio volume & mute (WirePlumber / wpctl)
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Screen brightness (brightnessctl)
binde = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# ── 8. Apps ───────────────────────────────────────────────────────────────────
# Default apps follow Settings → Apps (delo-app reads ~/.config/deloway/deloway.json)
bind = $mainMod, Return, exec, $delowayDir/bin/delo-app terminal
bind = $mainMod, E, exec, $delowayDir/bin/delo-app files
bind = $mainMod, W, exec, $delowayDir/bin/delo-app browser
bind = $mainMod, C, exec, antigravity-ide || code
bind = $mainMod SHIFT, W, exec, libreoffice
bind = $mainMod, X, exec, gnome-text-editor || gedit || kate || mousepad
bind = CTRL $mainMod, V, exec, pwvucontrol || pavucontrol
bind = $mainMod, I, global, quickshell:settingsToggle
bind = CTRL SHIFT, Escape, exec, mission-center || gnome-system-monitor || btop

# ── 9. User ───────────────────────────────────────────────────────────────────
bind = CTRL $mainMod, slash, exec, kitty -e nano $delowayDir/config/hyprland.conf
bind = CTRL $mainMod ALT, slash, exec, kitty -e nano $delowayDir/config/hyprland.conf

# ── 10. definitely not hyprshell ──────────────────────────────────────────────
bind = $mainMod SHIFT, A, global, quickshell:sidebarLeftToggle
bind = $mainMod SHIFT, slash, global, quickshell:cheatsheetToggle
bind = $mainMod SHIFT, question, global, quickshell:cheatsheetToggle

# ==============================================================================
# Window Rules - Modern Hyprland Standard
# ==============================================================================

# Dialogs & File Pickers
windowrule = float on, match:title ^(Open Folder|Open File|Save As|File Upload|Choose Files|Select a File|Enter name of file to save to.*|Save File)$
windowrule = center on, match:title ^(Open Folder|Open File|Save As|File Upload|Choose Files|Select a File|Enter name of file to save to.*|Save File)$
windowrule = size 800 550, match:title ^(Open Folder|Open File|Save As|File Upload|Choose Files|Select a File|Enter name of file to save to.*|Save File)$

# Authentication & Polkit Dialogs
windowrule = float on, match:class ^(polkit-gnome-authentication-agent-1|lxqt-policykit-agent|org.kde.polkit-kde-authentication-agent-1|hyprpolkitagent)$
windowrule = center on, match:class ^(polkit-gnome-authentication-agent-1|lxqt-policykit-agent|org.kde.polkit-kde-authentication-agent-1|hyprpolkitagent)$
windowrule = dim_around on, match:class ^(polkit-gnome-authentication-agent-1|lxqt-policykit-agent|org.kde.polkit-kde-authentication-agent-1|hyprpolkitagent)$

# Audio / Volume Controls
windowrule = float on, match:class ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$
windowrule = size 700 480, match:class ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$
windowrule = center on, match:class ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$

# Bluetooth & Network Utilities
windowrule = float on, match:class ^(blueman-manager|nm-connection-editor)$
windowrule = size 600 450, match:class ^(blueman-manager|nm-connection-editor)$
windowrule = center on, match:class ^(blueman-manager|nm-connection-editor)$

# Picture-in-Picture
windowrule = float on, match:title ^(Picture-in-Picture)$
windowrule = pin on, match:title ^(Picture-in-Picture)$
windowrule = keep_aspect_ratio on, match:title ^(Picture-in-Picture)$
windowrule = size 480 270, match:title ^(Picture-in-Picture)$
windowrule = move 100%-495 100%-285, match:title ^(Picture-in-Picture)$

# Layer rules for Quickshell overlays & Deloway surfaces
# Dock and App Drawer (deloway:launcher) are intentionally NOT blurred: flat, clean edges.
layerrule = blur on, match:namespace deloway:(topbar|quicksettings-capsule|sessionmenu|notification-toast|smart-notch)
layerrule = ignore_alpha 0.2, match:namespace deloway:(topbar|quicksettings-capsule|sessionmenu|notification-toast|smart-notch)
layerrule = no_anim on, match:namespace deloway:screenshot-overlay
layerrule = no_anim on, match:namespace deloway:dock-context-menu
layerrule = dim_around on, match:namespace deloway:sessionmenu

# Launch Deloway Quickshell Shell & Services
exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent
exec-once = gsettings set org.gnome.desktop.interface icon-theme "Reversal-black-dark"
exec-once = /home/waleed/.local/bin/localsend --hidden
exec-once = quickshell -p $delowayDir/shell
exec-once = $delowayDir/scripts/deloway-wallpaper-daemon.py
exec-once = sleep 1 && hyprctl dismissnotify
